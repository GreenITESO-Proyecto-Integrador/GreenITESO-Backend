name: Release - production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full approved commit SHA"
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      release_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      source_ref: production
      build: false
    secrets: inherit
