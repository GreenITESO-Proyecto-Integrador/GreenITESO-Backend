name: Pipeline tests

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/test_release_pipeline.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/test_release_pipeline.py"

jobs:
  release-contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Shell syntax check
        run: bash -n scripts/release.sh
      - name: Run mocked release tests
        run: python -m pytest -q tests/test_release_pipeline.py
