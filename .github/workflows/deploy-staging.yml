name: Release - staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full approved commit SHA"
        required: true
        type: string
      image_digest:
        description: "Digest from a successful dev release"
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      release_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      source_ref: staging
      image_digest: ${{ github.event_name == 'workflow_dispatch' && inputs.image_digest || '' }}
      build: false
    secrets: inherit
