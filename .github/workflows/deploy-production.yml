name: Release - production

on:
  pull_request:
    branches: [prod]
    types: [closed]

jobs:
  release:
    # Production has its own switch so it can be enabled without turning on the
    # dev and preprod cloud releases (which also disable the standalone Neon
    # migrations those environments still rely on).
    if: >-
      vars.CLOUD_PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'preprod' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      github_environment: production
      release_sha: ${{ github.event.pull_request.merge_commit_sha }}
      release_ref: prod
      source_ref: preprod
      source_release_sha: ${{ github.event.pull_request.head.sha }}
      # Production builds its own image for now (no staging release to reuse).
      # Set back to false, and restore the provenance step in _deploy.yml, once
      # preprod is released to Cloud Run.
      build: true
    secrets: inherit
