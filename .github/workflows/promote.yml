name: Promote

on:
  workflow_dispatch:
    inputs:
      promote_to:
        description: "Environment branch to advance and release"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: promotion-${{ inputs.promote_to }}
  cancel-in-progress: false

jobs:
  promote:
    name: Advance and release ${{ inputs.promote_to }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve approved source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.promote_to }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging) source_ref=dev; target_ref=staging; workflow=deploy-staging.yml ;;
            production) source_ref=staging; target_ref=main; workflow=deploy-production.yml ;;
            *) echo "Unsupported promotion target: $TARGET" >&2; exit 2 ;;
          esac
          source_sha="$(git ls-remote origin "refs/heads/${source_ref}" | awk '{print $1}')"
          if [ -z "$source_sha" ]; then
            echo "Source branch '${source_ref}' does not exist; refusing promotion." >&2
            exit 1
          fi
          provenance_output="$(mktemp)"
          trap 'rm -f "$provenance_output"' EXIT
          RELEASE_ENVIRONMENT="$TARGET" RELEASE_SHA="$source_sha" GITHUB_OUTPUT="$provenance_output" scripts/verify-source-release.sh
          source_digest="$(awk -F= '$1 == "image_digest" {print $2}' "$provenance_output")"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "target_ref=${target_ref}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "source_digest=${source_digest}" >> "$GITHUB_OUTPUT"
          echo "workflow=${workflow}" >> "$GITHUB_OUTPUT"

      - name: Advance target branch without relying on push triggers
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TARGET_REF: ${{ steps.source.outputs.target_ref }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TARGET_REF}" \
            -f sha="$SOURCE_SHA" \
            -F force=false

      - name: Dispatch target release with the approved SHA
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.source.outputs.workflow }}
          TARGET_REF: ${{ steps.source.outputs.target_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          set -euo pipefail
          gh workflow run "$WORKFLOW" \
            --ref "$TARGET_REF" \
            -f release_sha="$SOURCE_SHA" \
            -f image_digest="$SOURCE_DIGEST"
