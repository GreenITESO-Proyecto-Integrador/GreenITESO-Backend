name: Precommit

on:
  push:
  pull_request:

jobs:
  commit-lint:
    name: Validate Conventional Commit PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valida que el título del PR cumpla la convención (feat:, fix:, chore:, etc.)
      - name: Validate PR Title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  lint-ruff:
    name: Run Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: pip install --upgrade ruff

      - name: Execute Ruff Check
        # Si mantiene pyproject.toml dentro de app/, Ruff lo detectará si analiza app/,
        # o bien puede pasar la ruta explícita si se ubica en la raíz.
        run: ruff check app/