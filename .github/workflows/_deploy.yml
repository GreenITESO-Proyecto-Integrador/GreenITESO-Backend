name: Release (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target GitHub Environment / Cloud Run environment"
        required: true
        type: string
      release_sha:
        description: "Full commit SHA approved for this release"
        required: true
        type: string
      source_ref:
        description: "Branch whose current tip must still equal release_sha"
        required: true
        type: string
      build:
        description: "Build and push the immutable commit image (dev only)"
        required: true
        type: boolean

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    name: Migrate and release ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Reject stale release before migration
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${SOURCE_REF}" | awk '{print $1}')"
          if [ -z "$current_sha" ]; then
            echo "Source ref '${SOURCE_REF}' does not exist; refusing release." >&2
            exit 1
          fi
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo "Stale release: ${SOURCE_REF} is ${current_sha}, requested ${RELEASE_SHA}." >&2
            exit 1
          fi

      - name: Validate release configuration
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          ARTIFACT_REGISTRY_LOCATION: ${{ secrets.ARTIFACT_REGISTRY_LOCATION }}
          ARTIFACT_REGISTRY_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
          IMAGE_PROJECT_ID: ${{ secrets.IMAGE_PROJECT_ID }}
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          DJANGO_SECRET_KEY_SECRET: ${{ secrets.DJANGO_SECRET_KEY_SECRET }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL_SECRET }}
          DATABASE_URL_UNPOOLED_SECRET: ${{ secrets.DATABASE_URL_UNPOOLED_SECRET }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          MIGRATION_JOB_NAME: ${{ secrets.MIGRATION_JOB_NAME }}
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT ARTIFACT_REGISTRY_LOCATION ARTIFACT_REGISTRY_REPO IMAGE_PROJECT_ID CLOUD_RUN_SERVICE DJANGO_SECRET_KEY_SECRET DATABASE_URL_SECRET DATABASE_URL_UNPOOLED_SECRET DJANGO_ALLOWED_HOSTS MIGRATION_JOB_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "${name} is required in the '${{ inputs.environment }}' GitHub Environment." >&2
              exit 2
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Migrate and deploy the release digest
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          ARTIFACT_REGISTRY_LOCATION: ${{ secrets.ARTIFACT_REGISTRY_LOCATION }}
          ARTIFACT_REGISTRY_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
          IMAGE_PROJECT_ID: ${{ secrets.IMAGE_PROJECT_ID }}
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          BUILD_IMAGE: ${{ inputs.build }}
          DJANGO_SECRET_KEY_SECRET: ${{ secrets.DJANGO_SECRET_KEY_SECRET }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL_SECRET }}
          DATABASE_URL_UNPOOLED_SECRET: ${{ secrets.DATABASE_URL_UNPOOLED_SECRET }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          MIGRATION_JOB_NAME: ${{ secrets.MIGRATION_JOB_NAME }}
        run: scripts/release.sh
