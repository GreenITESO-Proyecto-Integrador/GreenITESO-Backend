name: Promote

on:
  workflow_dispatch:
    inputs:
      promote_to:
        description: "Open a promotion PR into the selected protected branch"
        required: true
        type: choice
        options:
          - preprod
          - main

concurrency:
  group: promotion-${{ inputs.promote_to }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    name: Open promotion PR to ${{ inputs.promote_to }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open a PR from the previous tier
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.promote_to }}
        run: |
          set -euo pipefail
          case "$TARGET_REF" in
            preprod) SOURCE_REF=dev ;;
            main) SOURCE_REF=preprod ;;
            *) echo "Unsupported promotion target: ${TARGET_REF}" >&2; exit 2 ;;
          esac

          source_sha="$(git ls-remote origin "refs/heads/${SOURCE_REF}" | awk '{print $1}')"
          if [ -z "$source_sha" ]; then
            echo "Source branch '${SOURCE_REF}' does not exist; refusing promotion." >&2
            exit 1
          fi
          target_sha="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          if [ -z "$target_sha" ]; then
            echo "Target branch '${TARGET_REF}' does not exist. Create/protect it through the agreed branch cutover before promoting." >&2
            exit 1
          fi

          existing_pr="$(gh pr list --base "$TARGET_REF" --head "$SOURCE_REF" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Promotion PR already exists: ${existing_pr}"
            exit 0
          fi

          gh pr create \
            --base "$TARGET_REF" \
            --head "$SOURCE_REF" \
            --title "chore: promote ${SOURCE_REF} -> ${TARGET_REF}" \
            --body "Promote validated ${SOURCE_REF} commit ${source_sha} into protected ${TARGET_REF}. Review CI and database migration evidence before merging. This workflow never updates protected branch refs directly."
