name: Release - dev

on:
  push:
    branches: [dev]

jobs:
  release:
    if: vars.CLOUD_DEPLOYMENT_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      release_sha: ${{ github.sha }}
      source_ref: dev
      build: true
    secrets: inherit
