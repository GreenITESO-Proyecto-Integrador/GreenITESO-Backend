name: Promote

on:
  workflow_dispatch:
    inputs:
      promote_to:
        description: "Environment branch to open a promotion PR into"
        required: true
        type: choice
        options:
          - preprod
          - prod

jobs:
  promote:
    name: Open promotion PR to ${{ inputs.promote_to }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source branch
        id: source
        run: |
          case "${{ inputs.promote_to }}" in
            preprod) echo "branch=dev" >> "$GITHUB_OUTPUT" ;;
            prod) echo "branch=preprod" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ inputs.promote_to }}" \
            --head "${{ steps.source.outputs.branch }}" \
            --title "promote: ${{ steps.source.outputs.branch }} -> ${{ inputs.promote_to }}" \
            --body "Automated promotion opened by @${{ github.actor }} via the Promote workflow." \
          || echo "::notice::A promotion PR from ${{ steps.source.outputs.branch }} to ${{ inputs.promote_to }} may already be open."
