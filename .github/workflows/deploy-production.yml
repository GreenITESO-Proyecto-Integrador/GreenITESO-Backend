name: Release - production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full approved commit SHA"
        required: true
        type: string
      image_digest:
        description: "Digest from a successful staging release"
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      release_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      source_ref: production
      image_digest: ${{ github.event_name == 'workflow_dispatch' && inputs.image_digest || '' }}
      build: false
    secrets: inherit
