[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming (PascalCase en clases, snake_case en funciones/variables, UPPER_CASE en constantes)
    "ANN",   # flake8-annotations (exige type hints en funciones y métodos)
    "DJ",    # flake8-django
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
]
ignore = [
    "E501",   # Desactivar límite estricto de longitud de línea (lo gestiona el formateador)
    
    # Excepciones de tipado
    "ANN401", # PERMITIDO: Uso explícito de typing.Any
    "ANN101", # Omitir obligatoriedad de tipar 'self' en métodos
    "ANN102", # Omitir obligatoriedad de tipar 'cls' en classmethods
    
    # Excepciones generales
    "BLE001", # PERMITIDO: Do not catch blind exception (permite except Exception:)
    "E722",   # PERMITIDO: Do not use bare 'except' (permite except: genérico)
]

[tool.pylint.basic]
# Convenciones de nombres (PascalCase en clases, snake_case en funciones/variables, UPPER_CASE en constantes)
class-naming-style = "PascalCase"
function-naming-style = "snake_case"
variable-naming-style = "snake_case"
argument-naming-style = "snake_case"
attr-naming-style = "snake_case"
method-naming-style = "snake_case"
module-naming-style = "snake_case"
const-naming-style = "UPPER_CASE"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "broad-exception-caught",   # Coherente con BLE001 permitido en Ruff
]

[tool.pylint.format]
max-line-length = 120
[tool.pylint.main]
load-plugins = ["pylint_django"]
# Generated migration state is checked by Django/PG integration, not style inference.
ignore-paths = [".*/migrations/.*"]

[tool.pylint.django]
django-settings-module = "green_iteso.settings"

[tool.pylint.design]
# Django TextChoices intentionally composes Enum, str and Choices hierarchies.
ignored-parents = ["django.db.models.enums.TextChoices"]
