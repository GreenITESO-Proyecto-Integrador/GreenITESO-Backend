name: Pipeline tests

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/test_release_pipeline.py"
      - "tests/test_dev_migration_evidence.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/test_release_pipeline.py"
      - "tests/test_dev_migration_evidence.py"

permissions:
  contents: read

jobs:
  release-contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Shell syntax check
        run: bash -n scripts/release.sh scripts/verify-source-release.sh
      - name: Run mocked release tests
        run: python -m pytest -c /dev/null -p no:cacheprovider -p no:django -q tests/test_release_pipeline.py tests/test_dev_migration_evidence.py
