name: Promote

on:
  workflow_dispatch:
    inputs:
      promote_to:
        description: "Environment branch to fast-forward and promote into"
        required: true
        type: choice
        options:
          - test
          - preprod
          - prod

jobs:
  promote:
    name: Promote to ${{ inputs.promote_to }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.promote_to }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source branch
        id: source
        run: |
          case "${{ inputs.promote_to }}" in
            test) echo "branch=dev" >> "$GITHUB_OUTPUT" ;;
            preprod) echo "branch=test" >> "$GITHUB_OUTPUT" ;;
            prod) echo "branch=preprod" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fetch source and target branches
        run: |
          git fetch origin "${{ steps.source.outputs.branch }}" "${{ inputs.promote_to }}"

      - name: Fast-forward promote
        if: inputs.promote_to != 'prod'
        run: |
          git push origin "origin/${{ steps.source.outputs.branch }}:${{ inputs.promote_to }}"

      - name: Open promotion PR
        if: inputs.promote_to == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ inputs.promote_to }}" \
            --head "${{ steps.source.outputs.branch }}" \
            --title "promote: ${{ steps.source.outputs.branch }} -> ${{ inputs.promote_to }}" \
            --body "Automated promotion opened by @${{ github.actor }} via the Promote workflow." \
          || echo "::notice::A promotion PR from ${{ steps.source.outputs.branch }} to ${{ inputs.promote_to }} may already be open."
