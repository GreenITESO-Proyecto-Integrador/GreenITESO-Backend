[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming (PascalCase en clases, snake_case en funciones/variables, UPPER_CASE en constantes)
    "ANN",   # flake8-annotations (exige type hints en funciones y métodos)
    "DJ",    # flake8-django
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
]
ignore = [
    "E501",   # Desactivar límite estricto de longitud de línea (lo gestiona el formateador)
    
    # Excepciones de tipado
    "ANN401", # PERMITIDO: Uso explícito de typing.Any
    "ANN101", # Omitir obligatoriedad de tipar 'self' en métodos
    "ANN102", # Omitir obligatoriedad de tipar 'cls' en classmethods
    
    # Excepciones generales
    "BLE001", # PERMITIDO: Do not catch blind exception (permite except Exception:)
    "E722",   # PERMITIDO: Do not use bare 'except' (permite except: genérico)
]