name: Promote

on:
  workflow_dispatch:
    inputs:
      promote_to:
        description: "Environment branch to fast-forward and promote into"
        required: true
        type: choice
        options:
          - test
          - preprod
          - prod

jobs:
  promote:
    name: Fast-forward ${{ inputs.promote_to }}
    if: inputs.promote_to != 'prod'
    runs-on: ubuntu-latest
    environment: ${{ inputs.promote_to }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source branch
        id: source
        run: |
          case "${{ inputs.promote_to }}" in
            test) echo "branch=dev" >> "$GITHUB_OUTPUT" ;;
            preprod) echo "branch=test" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fetch source and target branches
        run: |
          git fetch origin "${{ steps.source.outputs.branch }}" "${{ inputs.promote_to }}"

      - name: Fast-forward promote
        run: |
          git push origin "origin/${{ steps.source.outputs.branch }}:${{ inputs.promote_to }}"

  promote-prod:
    name: Open promotion PR to prod
    if: inputs.promote_to == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base prod \
            --head preprod \
            --title "promote: preprod -> prod" \
            --body "Automated promotion opened by @${{ github.actor }} via the Promote workflow." \
          || echo "::notice::A promotion PR from preprod to prod may already be open."
