name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target GitHub Environment / Cloud Run environment (dev, staging, production)"
        required: true
        type: string
      build:
        description: "Whether to build and push a new image (true only for dev)"
        required: true
        type: boolean

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check GCP configuration
        id: check
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          REGION: ${{ secrets.GCP_REGION }}
          DEV_PROJECT_ID: ${{ secrets.DEV_GCP_PROJECT_ID }}
          ARTIFACT_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          DJANGO_RUNTIME_CONFIG_READY: ${{ vars.DJANGO_RUNTIME_CONFIG_READY }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            dev|staging|production) ;;
            *)
              echo "::error::Automatic deployment is blocked: '${TARGET_ENVIRONMENT}' is not a supported Django environment."
              echo "::error::Use dev, staging, or production after the environment and pipeline names are aligned."
              exit 1
              ;;
          esac

          missing=""
          for variable in PROJECT_ID WIF_PROVIDER SERVICE_ACCOUNT REGION DEV_PROJECT_ID ARTIFACT_REPO CLOUD_RUN_SERVICE; do
            if [ -z "${!variable}" ]; then
              missing="$missing $variable"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Automatic deployment is blocked: missing GCP configuration ($missing)."
            echo "::error::Provision the environment-scoped deployment settings before enabling Cloud Run."
            exit 1
          fi

          if [ "$DJANGO_RUNTIME_CONFIG_READY" != "true" ]; then
            echo "::error::Automatic deployment is blocked until Cloud Run Django runtime configuration and the reviewed migration pipeline are ready."
            echo "::error::PR30 is still pending; after its replacement release workflow or an equivalent T14/T15 setup is deployed, set DJANGO_RUNTIME_CONFIG_READY=true."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set short SHA
        if: steps.check.outputs.ready == 'true'
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        if: steps.check.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Compute image reference
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "IMAGE=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.DEV_GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/greeniteso:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Configure Docker for Artifact Registry
        if: steps.check.outputs.ready == 'true' && inputs.build
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        if: steps.check.outputs.ready == 'true' && inputs.build
        run: docker build -t "$IMAGE" -f Dockerfile .

      - name: Push image
        if: steps.check.outputs.ready == 'true' && inputs.build
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        if: steps.check.outputs.ready == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE }}
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE }}
